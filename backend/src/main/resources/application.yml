spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/cs_study}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    # 요청이 끝날 때까지 영속성 컨텍스트와 DB 커넥션을 붙잡지 않는다. 커넥션은 트랜잭션이 끝나면 바로 반납한다
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: simple

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  # 멀티파트의 텍스트 필드가 ISO-8859-1로 읽혀 한글이 깨지던 것을 막는다
  servlet:
    encoding:
      charset: UTF-8
      force: true

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:https://hooks.slack.com/services/YOUR/WEBHOOK/URL}
  enabled: ${SLACK_ENABLED:false}
  morning-cron: "0 20 8 * * *"
  evening-cron: "0 10 18 * * *"
  weekly-cron: "0 0 9 * * MON"

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  # No fallback key: unset ADMIN_KEY closes administrator APIs.
  admin-key: ${ADMIN_KEY:}
  security:
    rate-limit-enabled: true
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:${RENDER:false}}

gemini:
  api-key: ${GEMINI_API_KEY:}

# 운영에서는 상태 확인만 연다. 커넥션 풀 같은 내부 지표는 로컬 부하테스트 프로필에서만 연다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
