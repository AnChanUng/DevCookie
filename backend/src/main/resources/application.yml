spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/cs_study}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: simple

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

server:
  port: 8080

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:https://hooks.slack.com/services/YOUR/WEBHOOK/URL}
  enabled: ${SLACK_ENABLED:false}
  morning-cron: "0 20 8 * * *"
  evening-cron: "0 10 18 * * *"
  weekly-cron: "0 0 9 * * MON"

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  # 관리자 화면(/admin/cu) 접속 키. Render에 ADMIN_KEY를 넣으면 그 값이 기본값을 덮는다
  admin-key: ${ADMIN_KEY:chanung}

gemini:
  api-key: ${GEMINI_API_KEY:}

# 자료 기부 화면에서 올린 파일을 저장소에 커밋할 때 쓰는 토큰. Render 대시보드에서 설정한다
github:
  token: ${GITHUB_TOKEN:}
  repo: ${GITHUB_REPO:AnChanUng/cs-study-platform}
  branch: ${GITHUB_BRANCH:master}
