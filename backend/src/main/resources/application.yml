spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/cs_study}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: simple

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  # 멀티파트의 텍스트 필드가 ISO-8859-1로 읽혀 한글이 깨지던 것을 막는다
  servlet:
    encoding:
      charset: UTF-8
      force: true

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:https://hooks.slack.com/services/YOUR/WEBHOOK/URL}
  enabled: ${SLACK_ENABLED:false}
  morning-cron: "0 20 8 * * *"
  evening-cron: "0 10 18 * * *"
  weekly-cron: "0 0 9 * * MON"

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  # 관리자 화면(/admin/cu) 접속 키. Render에 ADMIN_KEY를 넣으면 그 값이 기본값을 덮는다
  admin-key: ${ADMIN_KEY:chanung}

gemini:
  api-key: ${GEMINI_API_KEY:}
