services:
  - type: web
    name: cs-study-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: SLACK_ENABLED
        value: "false"
      - key: APP_BASE_URL
        value: https://cs-study-frontend-dg8c.onrender.com
      # Neon Postgres connection string (free tier, no expiry). Set in the Render
      # dashboard; Render's own free Postgres is deleted after 90 days.
      - key: DATABASE_URL
        sync: false
      # 관리자 페이지(/admin/cu) 접속 키. Render 대시보드에서 직접 설정한다
      - key: ADMIN_KEY
        sync: false
      # 자료 기부하기에서 올린 파일을 저장소에 커밋할 때 쓰는 GitHub 토큰.
      # Fine-grained token · cs-study-platform 저장소만 · Contents: Read and write
      - key: GITHUB_TOKEN
        sync: false

  - type: web
    name: cs-study-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://cs-study-backend-i0ln.onrender.com/api/v1
