services:
  - type: web
    name: cs-study-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: SLACK_ENABLED
        value: "false"
      - key: APP_BASE_URL
        value: https://cs-study-frontend.onrender.com
      # Neon Postgres connection string (free tier, no expiry). Set in the Render
      # dashboard; Render's own free Postgres is deleted after 90 days.
      - key: DATABASE_URL
        sync: false

  - type: web
    name: cs-study-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://cs-study-backend.onrender.com/api/v1
